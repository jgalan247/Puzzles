<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordlet — Vocabulary Game</title>
  <meta name="description" content="A Wordle-style vocabulary game for school subjects.">
  <meta name="theme-color" content="#157878">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wordlet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="wl-header">
    <h1>Wordlet</h1>
    <p>Read the definition, then guess the term.</p>
  </header>

  <main id="wordlet">
    <div class="wl-subject-row">
      <label for="wl-subject-select" class="wl-subject-label">Subject</label>
      <select id="wl-subject-select" class="wl-subject-select" aria-label="Subject"></select>
    </div>

    <div class="wl-modes" role="tablist" aria-label="Game mode">
      <button id="wl-mode-daily" class="wl-mode" type="button" role="tab">Daily</button>
      <button id="wl-mode-practice" class="wl-mode" type="button" role="tab">Practice</button>
    </div>
    <p id="wl-mode-note" class="wl-mode-note"></p>

    <p class="wl-help">
      Each guess must be a word of the right length. Tiles turn
      <span class="wl-swatch correct">green</span> (right letter, right spot),
      <span class="wl-swatch present">yellow</span> (right letter, wrong spot),
      or <span class="wl-swatch absent">grey</span> (not in the word). You get 6 tries.
    </p>

    <section class="wl-stats" aria-label="Your stats">
      <div class="wl-stat"><span class="wl-stat-num" id="wl-score">0</span><span class="wl-stat-label">Score</span></div>
      <div class="wl-stat"><span class="wl-stat-num" id="wl-streak">0</span><span class="wl-stat-label" id="wl-streak-label">Streak</span></div>
      <div class="wl-stat"><span class="wl-stat-num" id="wl-best">0</span><span class="wl-stat-label" id="wl-best-label">Best</span></div>
      <div class="wl-stat"><span class="wl-stat-num" id="wl-wins">0</span><span class="wl-stat-label">Wins</span></div>
    </section>

    <p id="wl-clue" class="wl-clue"></p>
    <div id="wl-board" class="wl-board"></div>
    <p id="wl-message" class="wl-message"></p>
    <div id="wl-keyboard" class="wl-keyboard"></div>

    <p class="wl-controls">
      <button id="wl-new" type="button">New word</button>
      <button id="wl-reveal" type="button">Give up</button>
    </p>

    <section class="wl-badges" aria-label="Badges">
      <h2 class="wl-badges-title">Badges</h2>
      <div id="wl-badge-list" class="wl-badge-list"></div>
      <button id="wl-reset" type="button" class="wl-reset">Reset progress</button>
    </section>
  </main>

  <div id="wl-toast" class="wl-toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
